<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="preload" href="/sqlite/sql-wasm.wasm" as="fetch" type="application/wasm" crossorigin />
		<title>Polyglot Bible Reader</title>
		<script>
			try {
				var stored = localStorage.getItem('biblical_reading_theme');
				var t = stored !== null ? parseInt(stored, 10) : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 75 : 25);
				if (!isNaN(t) && t >= 50) {
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.style.colorScheme = 'dark';
				} else {
					document.documentElement.setAttribute('data-theme', 'light');
					document.documentElement.style.colorScheme = 'light';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
